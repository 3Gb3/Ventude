# Lint e testes num Windows real em cada pull request (e sob demanda), sem publicar nada.
# O Release (release.yml) continua rodando só na main.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Dependências
        run: uv sync --frozen --python 3.12

      - name: Lint e testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run ruff check
          uv run pytest -q
