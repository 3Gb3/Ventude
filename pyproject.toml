[project]
name = "ventude"
version = "1.1.0"
description = "Dynamic Island leve para Windows: limites das suas IAs, mídia, clima, agenda e atalhos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials>=6.9",
    "curl-cffi>=0.15",
    "winrt-runtime>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-media>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-media-control>=3.0 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.0 ; sys_platform == 'win32'",
]

[project.scripts]
ventude = "ventude:main"

[project.gui-scripts]
ventude-gui = "ventude:main"

[build-system]
requires = ["uv_build>=0.8,<0.20"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
